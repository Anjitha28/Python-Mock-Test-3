<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | Python Mastery</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1e3a5f;
            --secondary-blue: #008eab;
            --text-main: #1d1d1f;
            --text-muted: #6e6e73;
            --bg-light: #f6f8fb;
            --error-red: #ef4444;
            --success-green: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: #ffffff;
            color: var(--text-main);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .card-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }
        .kvj-logo-img {
            max-width: 250px;
            max-height: 80px;
            margin-bottom: 25px;
            display: inline-block;
        }
        .datacamp-card {
            background: white;
            padding: 35px 30px;
            border-radius: 14px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
        }
        .datacamp-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-blue);
            margin-bottom: 6px;
            text-align: center;
            letter-spacing: -0.5px;
        }
        .datacamp-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
            font-weight: 500;
            line-height: 1.4;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .datacamp-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 6px;
        }
        .datacamp-input {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 12px 14px;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        .datacamp-input:focus {
            border-color: var(--secondary-blue);
            box-shadow: 0 0 0 3px rgba(0, 142, 171, 0.1);
        }
        .btn-submit {
            width: 100%;
            background: var(--secondary-blue);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            font-family: 'Montserrat', sans-serif;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #007790;
        }
        .alert-box {
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 18px;
            display: none;
        }
        .alert-box.error {
            background: #fef2f2;
            color: var(--error-red);
            border: 1px solid #fecaca;
        }
        .alert-box.success {
            background: #ecfdf5;
            color: var(--success-green);
            border: 1px solid #a7f3d0;
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="card-wrapper">
        <div style="text-align: center;">
            <img src="assets/Kvj logo.jpeg" alt="KVJ Logo" class="kvj-logo-img" onerror="this.src='Kvj logo.jpeg'">
        </div>

        <div class="datacamp-card">
            <h2 class="datacamp-title">Set New Password</h2>
            <div class="datacamp-subtitle">
                Welcome <strong id="username-display">User</strong>! Since this is your first login, please update your default password to continue.
            </div>

            <div id="alert-box" class="alert-box"></div>

            <form id="change-pass-form" onsubmit="handleChangePassword(event)">
                <div class="form-group">
                    <label class="datacamp-label">New Password</label>
                    <input type="password" id="new-password" class="datacamp-input" placeholder="Enter new password" required minlength="4">
                </div>

                <div class="form-group">
                    <label class="datacamp-label">Confirm New Password</label>
                    <input type="password" id="confirm-password" class="datacamp-input" placeholder="Confirm new password" required minlength="4">
                </div>

                <button type="submit" id="btn-submit" class="btn-submit">Save & Continue</button>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('auth_token');

        function showAlert(msg, type = 'error') {
            const box = document.getElementById('alert-box');
            box.textContent = msg;
            box.className = `alert-box ${type}`;
            box.style.display = 'block';
        }

        function hideAlert() {
            const box = document.getElementById('alert-box');
            box.style.display = 'none';
        }

        // Verify session authorization on page load
        async function initPage() {
            if (!token) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const res = await fetch('/api/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                if (!res.ok || !data.success) {
                    localStorage.clear();
                    window.location.href = 'index.html';
                    return;
                }

                // If user has ALREADY changed password, redirect to user dashboard
                if (!data.user.is_first_login) {
                    window.location.href = 'user_dashboard.html';
                    return;
                }

                document.getElementById('username-display').textContent = data.user.username;
            } catch (e) {
                console.error(e);
                window.location.href = 'index.html';
            }
        }
        initPage();

        async function handleChangePassword(e) {
            e.preventDefault();
            hideAlert();

            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const btnSubmit = document.getElementById('btn-submit');

            if (!newPassword || newPassword.trim() === '') {
                showAlert('Password cannot be empty or blank.');
                return;
            }

            if (newPassword !== confirmPassword) {
                showAlert('New password and Confirm password do not match.');
                return;
            }

            if (newPassword === 'password') {
                showAlert('Please choose a password different from the default "password".');
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Updating Password...';

            try {
                const res = await fetch('/api/auth/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        newPassword,
                        confirmPassword
                    })
                });

                const data = await res.json();

                if (!res.ok || !data.success) {
                    showAlert(data.message || 'Failed to update password.');
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Save & Continue';
                    return;
                }

                showAlert('Password updated successfully! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'user_dashboard.html';
                }, 1000);
            } catch (err) {
                console.error(err);
                showAlert('Network or server error. Please try again.');
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Save & Continue';
            }
        }

        // Background particle animation
        const canvas = document.getElementById("bg-canvas");
        const ctx = canvas.getContext("2d");
        let particles = [];
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();
        
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.size = Math.random() * 2;
                this.speed = Math.random() * 3 + 1;
                this.opacity = Math.random() * 0.5;
            }
            update() {
                this.y -= this.speed;
                if (this.y < -10) {
                    this.y = canvas.height + 10;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = `rgba(30, 58, 95, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        for (let i = 0; i < 50; i++) particles.push(new Particle());
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
